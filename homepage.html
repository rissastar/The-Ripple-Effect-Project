/* ============================================================
   THE RIPPLE EFFECT PROJECT — STYLES
   ============================================================ */

:root{
  --cream: #F7F3EA;
  --cream-dim: #EFE8D9;
  --stone: #E7E1D2;
  --ink: #28312E;
  --ink-soft: #4A544F;
  --river: #3F6E72;
  --river-deep: #2C4F52;
  --river-pale: #AECBCD;
  --honey: #D9A45B;
  --honey-deep: #B9803B;
  --rose: #C97B7B;

  --serif: "Fraunces", Georgia, serif;
  --sans: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --hand: "Caveat", cursive;

  --maxw: 1120px;
  --radius: 3px;
}

*,*::before,*::after{ box-sizing: border-box; }

html{ scroll-behavior: smooth; }

body{
  margin:0;
  font-family: var(--sans);
  background: var(--cream);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img{ max-width:100%; display:block; }

a{ color: var(--river-deep); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline: 3px solid var(--honey);
  outline-offset: 2px;
}

h1,h2,h3,h4{
  font-family: var(--serif);
  font-weight: 600;
  line-height: 1.15;
  color: var(--river-deep);
  margin: 0 0 .5em;
}
h1{ font-size: clamp(2.1rem, 5vw, 3.4rem); font-weight: 500; }
h2{ font-size: clamp(1.5rem, 3vw, 2.1rem); }
h3{ font-size: 1.25rem; }

p{ margin: 0 0 1em; max-width: 62ch; }
.wide p{ max-width: 74ch; }

.container{
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* ---------- Skip link ---------- */
.skip-link{
  position:absolute; left:-999px; top:auto;
  background: var(--ink); color:#fff; padding:.75rem 1.25rem;
  z-index: 200; border-radius: var(--radius);
}
.skip-link:focus{ left: 1rem; top: 1rem; }

/* ---------- Header / Nav ---------- */
.site-header{
  position: sticky; top:0; z-index: 100;
  background: rgba(247,243,234,.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--stone);
}
.header-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding: .85rem 1.5rem;
  max-width: var(--maxw); margin:0 auto;
}
.brand{
  display:flex; align-items:center; gap:.6rem;
  font-family: var(--serif); font-size: 1.15rem; font-weight:600;
  color: var(--river-deep); text-decoration:none;
}
.brand .ripple-dot{
  width: 14px; height:14px; border-radius:50%;
  background: var(--honey);
  box-shadow: 0 0 0 4px rgba(217,164,91,.25);
}

.nav-toggle{
  display:none;
  background:none; border: 1.5px solid var(--river-deep);
  border-radius: var(--radius); padding: .4rem .7rem;
  font-family: var(--sans); font-size:.9rem; cursor:pointer; color: var(--river-deep);
}

nav.main-nav{
  display:flex; flex-wrap:wrap; gap: 1.1rem;
}
nav.main-nav a{
  text-decoration:none; color: var(--ink-soft);
  font-size: .92rem; font-weight:600;
  padding: .3rem .1rem; border-bottom: 2px solid transparent;
}
nav.main-nav a:hover, nav.main-nav a.active{
  color: var(--river-deep); border-bottom-color: var(--honey);
}

@media (max-width: 900px){
  .nav-toggle{ display:inline-block; }
  nav.main-nav{
    display:none; position:absolute; left:0; right:0; top:100%;
    background: var(--cream); border-bottom: 1px solid var(--stone);
    flex-direction:column; padding: 1rem 1.5rem; gap:.9rem;
  }
  nav.main-nav.open{ display:flex; }
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:.5rem;
  font-family: var(--sans); font-weight:700; font-size: .95rem;
  padding: .8rem 1.4rem; border-radius: var(--radius);
  text-decoration:none; cursor:pointer; border: 2px solid transparent;
  transition: transform .15s ease, background .15s ease;
}
.btn:hover{ transform: translateY(-1px); }
.btn-primary{ background: var(--river-deep); color:#fff; }
.btn-primary:hover{ background: var(--river); }
.btn-secondary{ background: transparent; border-color: var(--river-deep); color: var(--river-deep); }
.btn-secondary:hover{ background: var(--river-deep); color:#fff; }
.btn-honey{ background: var(--honey); color: var(--ink); }
.btn-honey:hover{ background: var(--honey-deep); color:#fff; }
.btn-row{ display:flex; gap: .9rem; flex-wrap:wrap; margin-top: 1.5rem; }

/* ---------- Ripple divider ---------- */
.ripple-divider{
  display:flex; justify-content:center; margin: 3.5rem 0;
}
.ripple-divider svg{ width: 140px; height: 40px; opacity:.55; }

@media (prefers-reduced-motion: no-preference){
  .ripple-divider circle{ animation: pulse 3.5s ease-in-out infinite; transform-origin: center; }
  .ripple-divider circle:nth-child(2){ animation-delay: .5s; }
  .ripple-divider circle:nth-child(3){ animation-delay: 1s; }
  @keyframes pulse{
    0%,100%{ opacity:.25; transform: scale(.9);} 50%{ opacity:.7; transform: scale(1);}
  }
}

/* ---------- Hero ---------- */
.hero{
  padding: 4.5rem 0 3rem;
  position: relative;
  overflow: hidden;
}
.hero-grid{
  display:grid; grid-template-columns: 1.15fr .85fr; gap: 3rem; align-items:center;
}
@media (max-width: 860px){ .hero-grid{ grid-template-columns: 1fr; } }

.eyebrow-plain{
  font-family: var(--hand); font-size: 1.5rem; color: var(--honey-deep);
  margin-bottom: .25rem; display:block;
}
.hero .tagline{
  font-size: 1.15rem; color: var(--ink-soft); max-width: 46ch;
}
.hero-quote{
  font-family: var(--serif); font-style: italic; color: var(--river-deep);
  font-size: 1.15rem; border-left: 3px solid var(--honey); padding-left: 1.1rem;
  max-width: 40ch; margin-top: 1.5rem;
}
.hero-art{ display:flex; justify-content:center; }
.hero-art svg{ width: 100%; max-width: 340px; height:auto; }

/* ---------- Sections ---------- */
section{ padding: 2.2rem 0; }
.section-tight{ padding: 1rem 0; }
.bg-panel{ background: var(--cream-dim); border-top: 1px solid var(--stone); border-bottom: 1px solid var(--stone); }
.bg-river{ background: var(--river-deep); color: #EFE8D9; }
.bg-river h2, .bg-river h3{ color: #fff; }
.bg-river a{ color: var(--river-pale); }

/* ---------- Cards ---------- */
.card-grid{
  display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap: 1.4rem; margin-top: 1.75rem;
}
.card{
  background: #fff; border: 1px solid var(--stone);
  border-top: 4px solid var(--river);
  padding: 1.5rem; border-radius: var(--radius);
}
.card h3{ margin-bottom:.4rem; }
.card p{ font-size: .95rem; color: var(--ink-soft); margin-bottom: .8rem; }
.card a.card-link{ font-weight:700; font-size:.9rem; text-decoration:none; }
.card.honey-top{ border-top-color: var(--honey); }
.card.rose-top{ border-top-color: var(--rose); }

/* ---------- Lists with items (bag contents etc.) ---------- */
.chip-list{ list-style:none; margin: 1rem 0; padding:0; display:flex; flex-wrap:wrap; gap:.5rem; }
.chip-list li{
  background: var(--stone); color: var(--ink);
  font-size: .85rem; padding: .35rem .75rem; border-radius: 999px;
}
.chip-list.future li{ background: transparent; border: 1px dashed var(--honey-deep); color: var(--honey-deep); }

.label-tag{
  display:inline-block; font-size:.75rem; font-weight:700; letter-spacing:.02em;
  background: var(--honey); color: var(--ink); padding:.15rem .55rem; border-radius: 999px;
  margin-bottom: .6rem;
}

/* ---------- Steps (Create a Ripple) ---------- */
.step-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap:1.2rem; margin-top:1.75rem; }
.step{ border-left: 3px solid var(--river); padding-left: 1rem; }
.step h3{ margin-bottom:.3rem; font-size:1.1rem; }
.step p{ font-size:.92rem; color: var(--ink-soft); }

/* ---------- Resources ---------- */
.res-jump{
  display:flex; flex-wrap:wrap; gap:.5rem; margin: 1.5rem 0 2rem;
}
.res-jump a{
  text-decoration:none; font-size:.85rem; font-weight:600;
  background:#fff; border:1px solid var(--stone); padding:.4rem .8rem; border-radius:999px;
  color: var(--river-deep);
}
.res-category{ margin: 2.5rem 0; scroll-margin-top: 90px; }
.res-category h2{ display:flex; align-items:center; gap:.5rem; }
.res-category .cat-note{
  font-size: .88rem; color: var(--ink-soft); font-style: italic; margin-top:-.5rem;
}
.res-card{
  background:#fff; border:1px solid var(--stone); border-radius: var(--radius);
  padding: 1.25rem 1.4rem; margin-bottom: 1rem;
}
.res-card h3{ font-size: 1.05rem; margin-bottom:.3rem; }
.res-card .who{ font-size:.82rem; color: var(--ink-soft); margin-bottom:.5rem; }
.res-card .desc{ font-size:.92rem; margin-bottom:.7rem; }
.res-actions{ display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:.6rem; }
.res-actions a{
  text-decoration:none; font-size:.85rem; font-weight:700;
  border: 1.5px solid var(--river-deep); color: var(--river-deep);
  padding:.4rem .8rem; border-radius: var(--radius);

.res-actions a:hover{ background: var(--river-deep); color:#fff; }
.res-meta{ font-size:.78rem; color: var(--ink-soft); display:flex; flex-wrap:wrap; gap: 1rem; }
.res-meta .verified{ color: var(--honey-deep); }

.urgent-block{
  background: var(--river-deep); color:#fff; padding: 1.6rem; border-radius: var(--radius);
  margin: 1.5rem 0 2.5rem;
}
.urgent-block h2{ color:#fff; margin-bottom:.6rem; }
.urgent-block .res-actions a{ border-color:#fff; color:#fff; }
.urgent-block .res-actions a:hover{ background:#fff; color: var(--river-deep); }

.disclaimer-box{
  font-size: .85rem; color: var(--ink-soft); background: var(--cream-dim);
  border: 1px solid var(--stone); padding: 1rem 1.2rem; border-radius: var(--radius);
  margin-top: 2rem;
}

/* ---------- Log book / handwritten quote ---------- */
.logbook-quote{
  font-family: var(--hand); font-size: 1.4rem; color: var(--river-deep);
  background: var(--stone); padding: 1.2rem 1.5rem; border-radius: var(--radius);
  transform: rotate(-.4deg);
}

/* ---------- Forms ---------- */
.form-field{ margin-bottom: 1.2rem; display:block; }
.form-field label{ display:block; font-weight:700; font-size:.9rem; margin-bottom:.35rem; }
.form-field input, .form-field select, .form-field textarea{
  width:100%; font-family: var(--sans); font-size: .95rem;
  padding: .65rem .8rem; border:1.5px solid var(--stone); border-radius: var(--radius);
  background:#fff; color: var(--ink);
}
.form-note{ font-size:.82rem; color: var(--ink-soft); }
.form-status{ margin-top:1rem; font-size:.9rem; }

/* ---------- Footer ---------- */
footer.site-footer{
  background: var(--river-deep); color: #EFE8D9;
  padding: 3rem 0 2rem; margin-top: 4rem;

footer.site-footer a{ color:#fff; }
.footer-grid{ display:grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 2rem; }
@media (max-width:700px){ .footer-grid{ grid-template-columns: 1fr; } }
.footer-grid h4{ color: #fff; font-size: .95rem; font-family: var(--sans); font-weight:700; text-transform:none; margin-bottom:.6rem; }
.footer-grid ul{ list-style:none; padding:0; margin:0; }
.footer-grid li{ margin-bottom:.45rem; font-size:.9rem; }
.footer-bottom{ font-size:.8rem; opacity:.75; margin-top: 2rem; border-top: 1px solid rgba(255,255,255,.15); padding-top:1.2rem; }

/* ---------- Utility ---------- */
.text-center{ text-align:center; }
.mt-0{ margin-top:0; }
.small{ font-size:.85rem; color: var(--ink-soft); }
.final-cta{ text-align:center; padding: 4rem 0; }
.final-cta h2{ font-size: clamp(1.7rem,4vw,2.6rem); }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ animation-duration: .001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

function esc(str){
  if(!str) return "";
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function ripple(){
  return `<div class="ripple-divider" aria-hidden="true">
    <svg viewBox="0 0 140 40"><circle cx="70" cy="20" r="4" fill="var(--river)"/>
    <circle cx="70" cy="20" r="12" fill="none" stroke="var(--river)" stroke-width="1.5"/>
    <circle cx="70" cy="20" r="20" fill="none" stroke="var(--honey)" stroke-width="1.5"/></svg>
  </div>`;
}

function heroArtSVG(){
  return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="150" cy="150" r="6" fill="var(--honey)"/>
    <circle cx="150" cy="150" r="34" fill="none" stroke="var(--river)" stroke-width="2" opacity=".8"/>

    <circle cx="150" cy="150" r="132" fill="none" stroke="var(--river)" stroke-width="1.5" opacity=".22"/>
  </svg>`;
}

}

function renderAbout(){

    <h2>The biggest idea</h2>
    <p>This project isn't really about bags, bracelets, donations, or the River Box. Those are just the ways the idea currently exists. The bigger idea is that kindness can move. One person can start it. A stranger can pass it to another stranger. A tiny act can travel farther than the person who started it will ever know.</p>

  <section class="bg-panel"><div class="container wide">

    <p>The movie <em>Pay It Forward</em> is one of the things that planted the seed for this. The idea that stuck with me: do something good for another person without expecting them to repay you — instead, they pass something good along to somebody else. One act becomes another, then another. You don't necessarily get to see where the chain ends. That's exactly what I love about a ripple. I don't need to know how far something I do travels. I just want to give it somewhere to begin.</p>

function renderStory(){
  return `
  ${pageHeader("My story")}
  <section><div class="container wide">
    <p>I grew up experiencing things that changed how I see people. I was taken into foster care at 12 and moved through multiple foster homes. I've dealt with abuse, trauma, difficult relationships, and periods where ordinary things felt a lot harder than they looked from the outside. There have been times I've felt incredibly alone.</p>
    <p>Because of that, I understand what it feels like to be overlooked. I understand how someone can look completely fine while carrying something nobody else can see. And I understand how much a tiny moment of kindness can matter when you're already having a difficult day.</p>
    <p>I can't fix everyone's life. I can't solve poverty, addiction, or mental illness, and I can't remove someone's trauma. But I can choose kindness. Maybe I can make one person's day a little lighter. Maybe they pass that along. That's enough reason to start.</p>
  </div></section>

  ${ripple()}

  <section class="bg-panel"><div class="container wide">
    <h2>It started anonymously</h2>
    <p>When I first imagined doing this, I didn't picture myself making a public page. I wanted to leave little things for strangers and just walk away — no recognition, no attention, just: someone thought about you today.</p>
    <p>I have social anxiety, and being seen, talking to strangers, posting publicly, and asking people for support can be hard for me. Anonymity is what let me take the first step. But eventually I realized that if I wanted this idea to grow beyond me, I had to let people see it — I had to make a page, talk about it, and ask for support. That's become an unexpected part of my own growth.</p>
    <p>My therapist has talked with me about gradually facing uncomfortable situations instead of letting anxiety keep making my world smaller. This project has become part of that, without turning it into a case study. It started anonymously because that's what I could handle. Becoming more visible is another step I'm learning to take.</p>
  </div></section>

  <section><div class="container wide">
    <h2>The Tim Hortons moment</h2>
    <p>One of the moments that's stayed with me: giving a kindness bag to a man at Tim Hortons. It wasn't about what the bag was worth — it was seeing what it meant to him that a stranger had thought about him. That reaction is a big part of why I kept going.</p>
  </div></section>

  ${ripple()}

  <section class="bg-panel"><div class="container wide">
    <h2>Not the only one</h2>
    <p>Three people close to me have already helped hand out kindness bags — they helped turn this from an idea in my head into something actually happening. More people may help as it grows, and I'll be honest here about who's involved as that changes.</p>
  </div></section>
  `;
}

function resourceCard(r){
  const actions = [];
  if(r.phone) actions.push(`<a href="tel:${r.phone.replace(/[^0-9+]/g,"")}">Call ${esc(r.phone)}</a>`);
  if(r.text) actions.push(`<a href="sms:${(r.phone||"").replace(/[^0-9+]/g,"")}">Text ${esc(r.text)}</a>`);
  if(r.website) actions.push(`<a href="${esc(r.website)}" target="_blank" rel="noopener">Visit website</a>`);
  return `
  <div class="res-card">
    <h3>${esc(r.name)}</h3>
    <div class="who">For: ${esc(r.who)}</div>
    <div class="desc">${esc(r.description)}</div>
    <div class="res-actions">${actions.join("")}</div>
    <div class="res-meta">
      <span>🕐 ${esc(r.hours)}</span>
      <span>📍 ${esc(r.coverage)}</span>
      <span class="verified">Last verified: ${esc(r.lastVerified)}</span>
    </div>
  </div>`;
}

}

/* ============================================================ ROUTER */

function currentRouteName(){
  const hash = location.hash.replace(/^#\/?/, "");
  return ROUTES[hash] ? hash : "home";
}

function render(){
  const routeName = currentRouteName();
  const main = document.getElementById("main");
  main.innerHTML = ROUTES[routeName].render();
  document.title = routeName === "home"
    ? "The Ripple Effect Project — Small acts. Big ripples."
    : `${ROUTES[routeName].label} — The Ripple Effect Project`;

  document.querySelectorAll(".main-nav a").forEach(a=>{
    a.classList.toggle("active", a.dataset.route === routeName);
  });

  document.getElementById("main-nav").classList.remove("open");
  document.getElementById("nav-toggle").setAttribute("aria-expanded","false");
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});

  const form = document.getElementById("request-form");
  if(form){
    form.addEventListener("submit", (e)=>{
      e.preventDefault();
      document.getElementById("req-status").textContent =
        "This form isn't wired up to send anywhere yet — please use the Contact page for now. Thank you for wanting to help.";
    });
  }
}

function initShell(){
  document.getElementById("shell-header").innerHTML = renderHeader();
  document.getElementById("shell-footer").innerHTML = renderFooter();

  document.getElementById("nav-toggle").addEventListener("click", ()=>{
    const nav = document.getElementById("main-nav");
    const open = nav.classList.toggle("open");
    document.getElementById("nav-toggle").setAttribute("aria-expanded", open ? "true":"false");
  });

  window.addEventListener("hashchange", render);
  if(!location.hash) location.hash = "#/home";
  render();
}

document.addEventListener("DOMContentLoaded", initShell);
